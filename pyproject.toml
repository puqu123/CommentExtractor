[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "commentextractor"
version = "0.2.13"
description = "Offline Office review comment extraction desktop tool"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
dependencies = [
  "PySide6>=6.6,<6.10",
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7,<1",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime==1.4.4"]
dev = ["pytest>=8,<9", "pyinstaller>=6,<7", "python-docx>=1.2,<2", "python-pptx>=1,<2", "Pillow>=10,<12"]

[project.gui-scripts]
commentextractor = "commentextract.app:main"

[project.scripts]
commentextractor-cli = "commentextract.cli:main"

[tool.setuptools.packages.find]
include = ["commentextract*"]

[tool.setuptools.package-data]
commentextract = ["assets/*.svg", "assets/*.png", "assets/*.ico", "assets/*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
